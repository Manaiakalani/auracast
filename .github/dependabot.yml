version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # typescript-eslint does not support TypeScript 7 yet.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Runtime is Node 22; keep @types/node on a matching line.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 0.4.0 ships ESM imports without file extensions, which Node cannot resolve.
      - dependency-name: "@material/material-color-utilities"
        versions: ["0.4.x"]
    groups:
      npm-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /relay
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pip-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
